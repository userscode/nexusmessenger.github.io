<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-gray { background-color: #D1D5DB; }
        .input-line {
            border-bottom: 1.5px solid #4b5563;
            width: 80%;
            margin: 0 auto;
        }
        .hidden { display: none; }
        /* Стили для скругления как на макете */
        .rounded-login { border-radius: 2.5rem; }
        .rounded-chat { border-radius: 3rem; }
    </style>
</head>
<body class="bg-white h-screen flex items-center justify-center font-sans">

    <!-- СТРАНИЦА 1: ВХОД -->
    <div id="loginPage" class="w-full max-w-sm px-8 flex flex-col items-center gap-6">
        
        <!-- Поле IP -->
        <div class="w-full custom-gray rounded-login p-4 flex flex-col items-center">
            <input id="serverAddr" type="text" value="ws://localhost:8888/ws" 
                   class="bg-transparent w-full text-center outline-none text-gray-700" placeholder="ip:port">
            <div class="input-line mt-1"></div>
        </div>

        <!-- Поле Имя -->
        <div class="w-full custom-gray rounded-login p-4 flex flex-col items-center">
            <input id="username" type="text" 
                   class="bg-transparent w-full text-center outline-none text-gray-700" placeholder="имя пользователя">
            <div class="input-line mt-1"></div>
        </div>

        <!-- Поле Пароль -->
        <div class="w-full custom-gray rounded-login p-4 flex flex-col items-center">
            <input id="password" type="password" 
                   class="bg-transparent w-full text-center outline-none text-gray-700" placeholder="пароль">
            <div class="input-line mt-1"></div>
        </div>

        <!-- Кнопка Connect -->
        <button onclick="goToChat()" 
                class="mt-4 w-48 bg-indigo-900 text-white py-3 rounded-full text-lg shadow-md hover:bg-indigo-800 active:scale-95 transition">
            connect
        </button>
    </div>

    <!-- СТРАНИЦА 2: ЧАТ -->
    <div id="chatPage" class="w-full max-w-md h-screen p-6 flex flex-col hidden">
        
        <!-- Заголовок с кнопкой назад -->
        <div class="flex items-center mb-4">
            <button onclick="goToLogin()" class="text-gray-500 mr-4">← назад</button>
            <h2 id="chatTitle" class="font-bold text-lg">Чат</h2>
        </div>

        <!-- Область сообщений -->
        <div id="chatBox" class="flex-grow custom-gray rounded-chat p-6 overflow-y-auto flex flex-col gap-3 shadow-inner">
            <div class="text-gray-500 text-center mt-20">область с сообщениями</div>
        </div>

        <!-- Поле ввода и Кнопка отправить -->
        <div class="mt-6 flex gap-3 items-end">
            <div class="flex-grow custom-gray rounded-login p-4 flex flex-col items-center">
                <input id="messageInput" type="text" 
                       class="bg-transparent w-full outline-none text-gray-700" placeholder="сообщение">
                <div class="input-line mt-1 w-full"></div>
            </div>

            <button onclick="sendMessage()" 
                    class="bg-green-400 w-20 h-20 rounded-2xl font-bold text-xs flex items-center justify-center text-center leading-tight hover:bg-green-500 active:scale-95 transition">
                ОТПРАВИ<br>ТЬ
            </button>
        </div>
    </div>

    <script>
        let socket;
        let currentUser = "";

        function goToChat() {
            const user = document.getElementById('username').value.trim();
            const addr = document.getElementById('serverAddr').value.trim();

            if (!user) {
                alert("Введите имя пользователя!");
                return;
            }

            currentUser = user;
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('chatPage').classList.remove('hidden');
            document.getElementById('chatTitle').innerText = "Чат: " + addr;

            connect(addr);
        }

        function goToLogin() {
            if (socket) socket.close();
            document.getElementById('chatPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
        }

        function connect(addr) {
            socket = new WebSocket(addr);

            socket.onopen = () => {
                addMessage("[Система]: Подключено к серверу");
            };

            socket.onmessage = (event) => {
                addMessage(event.data);
            };

            socket.onclose = () => {
                addMessage("[Система]: Соединение разорвано");
            };

            socket.onerror = () => {
                addMessage("[Ошибка]: Не удалось соединиться");
            };
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const msg = input.value.trim();
            
            if (socket && socket.readyState === WebSocket.OPEN && msg) {
                socket.send(`${currentUser}: ${msg}`);
                input.value = "";
            }
        }

        function addMessage(text) {
            const chatBox = document.getElementById('chatBox');
            
            // Убираем текст-заглушку при первом сообщении
            if (chatBox.innerText.includes("область с сообщениями")) {
                chatBox.innerHTML = "";
            }

            const msgDiv = document.createElement('div');
            msgDiv.className = "bg-white/60 p-3 rounded-2xl self-start max-w-[85%] text-sm shadow-sm";
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Отправка по Enter
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
